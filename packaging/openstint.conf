# /etc/openstint.conf -- arguments for openstint.service
#
# This file is a systemd EnvironmentFile, NOT a shell script: no command
# substitution, no variable expansion, one KEY=VALUE per line.
#
# Edit here rather than in the unit file. This file is marked as a conffile,
# so package upgrades keep your version; the unit file is replaced on upgrade.
#
# After editing:
#   sudo systemctl restart openstint.service
#
# ---------------------------------------------------------------------------
# openstint_rtlsdr (the binary this unit runs by default)
# ---------------------------------------------------------------------------
#   -d ser_nr    default: first    serial number of the desired RTL-SDR
#   -g <0..40>   default: 20       tuner gain in dB
#   -b           default: off      enable bias-tee (+4.5 V)
#   -c file.iq   default: off      replay a CU8 IQ capture instead of the radio
#   -p port      default: 5556     ZeroMQ publisher port
#   -m           default: off      monitor mode (print received frames to stdout)
#   -t           default: off      use the system clock as timebase (beware NTP jumps)
#   -s dir       default: .        RC4 registry storage directory
#
# ---------------------------------------------------------------------------
# openstint_hackrf (if you switch ExecStart to the HackRF binary)
# ---------------------------------------------------------------------------
# The gain flags differ -- HackRF has no -g. Use instead:
#   -l <0..40>   default: 24       LNA gain (0/8/16/24/32/40)
#   -v <0..62>   default: 20       VGA gain (steps of 2)
#   -a           default: off      enable preamp (+13 dB)
# ...and then a sensible value here is:
#   OPENSTINT_ARGS="-l 24 -v 20 -s /var/lib/openstint"
#
# ---------------------------------------------------------------------------
# -s points at the StateDirectory the unit creates, which is writable by the
# 'openstint' service user. A relative path would resolve against
# /var/lib/openstint anyway, but spell it out so the intent survives edits.
OPENSTINT_ARGS="-g 20 -s /var/lib/openstint"
