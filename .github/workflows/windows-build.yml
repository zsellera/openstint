name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        build_type: [Release, Debug]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        cache: true
        # rtl-sdr, hackrf, liquid-dsp and libfec are built from pinned source
        # by cmake/Dependencies.cmake. That replaces three things that used to
        # live in this file: the MSYS2 rtl-sdr and hackrf packages (rtl-sdr
        # was stuck at 2.0.2, built November 2024), an autotools build of
        # libfec patched with two seds, and -- worst of it -- liquid-dsp
        # pulled as a prebuilt .a and .dll from the master branch of an
        # unrelated project's repository, unversioned and unverified.
        install: >-
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-zeromq
          mingw-w64-x86_64-cppzmq
          mingw-w64-x86_64-libusb
          git
          pkg-config
          zip

    - name: Build OpenStint
      shell: msys2 {0}
      run: |
        cmake -G "Ninja" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -B build .
        ninja -C build

    - name: Setup Python
      if: matrix.build_type == 'Release'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build bridge .exe
      if: matrix.build_type == 'Release'
      run: |
        pip install pyzmq tornado pyinstaller
        pyinstaller --onefile --name bridge-zround --hidden-import=zmq --hidden-import=tornado integrations/bridge-zround.py
        pyinstaller --onefile --name bridge-rcgtiming --hidden-import=zmq --hidden-import=tornado integrations/bridge-rcgtiming.py

    - name: Package binaries
      shell: msys2 {0}
      run: |
        set -eu
        # The .exe files and their DLLs both come from `cmake --install`. The
        # DLL set is resolved by install(RUNTIME_DEPENDENCY_SET) in
        # src/CMakeLists.txt, which replaces the old
        # `ldd | grep mingw64 | awk | xargs cp || true` line -- that one
        # swallowed its own failures, so a missing DLL only showed up as a
        # user's .exe refusing to start.
        cmake --install build --prefix "$PWD/staging"
        mkdir openstint-windows-x64
        cp staging/bin/* openstint-windows-x64/

        # With the SDR and DSP libraries linked statically, what is left is
        # the toolchain runtime, ZeroMQ and libusb. Assert the two binaries
        # and at least one DLL made it, so an empty or partial install fails
        # here rather than in a download.
        test -f openstint-windows-x64/openstint_hackrf.exe
        test -f openstint-windows-x64/openstint_rtlsdr.exe
        ls openstint-windows-x64/*.dll >/dev/null
        for lib in librtlsdr libhackrf libliquid libfec; do
          if ls openstint-windows-x64/ | grep -qi "${lib}"; then
            echo "::error::${lib} was shipped as a DLL; it must be linked statically"
            exit 1
          fi
        done
        ls -l openstint-windows-x64/

        cp README.md openstint-windows-x64/
        cp LICENSE openstint-windows-x64/
        cp tools/start.bat openstint-windows-x64/
        cp -r integrations openstint-windows-x64/

    - name: Add bridge executables
      if: matrix.build_type == 'Release'
      shell: msys2 {0}
      run: |
        cp dist/bridge-zround.exe openstint-windows-x64/
        cp dist/bridge-rcgtiming.exe openstint-windows-x64/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: openstint-windows-x64-${{ matrix.build_type }}
        path: openstint-windows-x64/

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Compute release metadata
      id: meta
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        else
          BRANCH="${GITHUB_REF_NAME}"
          echo "tag=nightly-${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "name=Nightly Windows Build (${BRANCH})" >> "$GITHUB_OUTPUT"
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Download release ZIPs
      uses: actions/download-artifact@v8
      with:
        pattern: openstint-windows-x64-*
        merge-multiple: true
        path: release-zips
        skip-decompress: true

    - name: Create or update release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.meta.outputs.tag }}
        name: ${{ steps.meta.outputs.name }}
        body: |
          Automated build of OpenStint for Windows 64-bit

          Branch: ${{ github.ref_name }}
          Built from commit ${{ github.sha }}
        files: release-zips/*.zip
        prerelease: ${{ steps.meta.outputs.prerelease }}
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
