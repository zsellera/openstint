name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        build_type: [Release, Debug]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        cache: true
        # rtl-sdr and hackrf are built from pinned source by
        # cmake/Dependencies.cmake, replacing the MSYS2 packages of the same
        # name (rtl-sdr was stuck at 2.0.2, built November 2024). MSYS2 has no
        # package for liquid-dsp or libfec, so those two are still fetched by
        # the steps below, exactly as they were before the vendoring: liquid as
        # a prebuilt CubicSDR binary, libfec compiled from source. autoconf,
        # automake, libtool and make exist in this list only for that libfec
        # build -- the project itself is CMake and Ninja.
        install: >-
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-zeromq
          mingw-w64-x86_64-cppzmq
          mingw-w64-x86_64-libusb
          git
          make
          autoconf
          automake
          libtool
          pkg-config
          zip

    # MSYS2 has no liquid-dsp package, so this takes the prebuilt MinGW binaries
    # from CubicSDR's vendored copy. Unversioned and served off a branch, so it
    # can change under us without warning -- the reason the other three
    # libraries are pinned by revision instead. Kept because building liquid
    # from source on MinGW does not work: upstream's CMakeLists shells out to a
    # .sh for its version string, which CMake cannot launch on Windows, defines
    # only a SHARED target, and links `c`, for which MinGW has no archive.
    #
    # libliquid.a is a real static archive, not an import library, so liquid
    # ends up inside the .exe and the matching DLL is never needed -- CubicSDR
    # ships one next to it, and the older version of this step downloaded it,
    # but nothing has ever linked against it. It goes to /mingw64/lib rather
    # than the old /mingw64/bin because that is where find_library() in
    # cmake/Dependencies.cmake looks.
    - name: Install liquid-dsp
      shell: msys2 {0}
      run: |
        set -eu
        LIQUID=https://raw.githubusercontent.com/cjcliffe/CubicSDR/refs/heads/master/external/liquid-dsp
        mkdir -p /mingw64/include/liquid
        curl -sSfL -o /mingw64/include/liquid/liquid.h "$LIQUID/include/liquid/liquid.h"
        curl -sSfL -o /mingw64/lib/libliquid.a        "$LIQUID/gcc/64/libliquid.a"

    # No MSYS2 package and no pinned revision: upstream is quiet's fork of
    # ka9q's libfec, whose K=9 r=1/2 Viterbi API has not changed in twenty
    # years. The two seds are what make its autotools build work under MinGW --
    # dropping `-lc`, which has no archive here, and naming the shared object
    # .dll instead of .so. Both libfec.a and libfec.dll land in /mingw64/lib;
    # there is no import library, so find_library() takes the static archive
    # and libfec ends up inside the .exe.
    - name: Install libfec
      shell: msys2 {0}
      run: |
        set -eu
        git clone --depth 1 https://github.com/quiet/libfec.git
        cd libfec
        ./configure --prefix=/mingw64
        sed -i 's/-lc$//' Makefile
        sed -i 's/libfec\.so/libfec.dll/' Makefile
        make
        mkdir -p /mingw64/lib
        cp libfec.dll libfec.a /mingw64/lib
        cp fec.h /mingw64/include

    - name: Build OpenStint
      shell: msys2 {0}
      run: |
        cmake -G "Ninja" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -B build .
        ninja -C build

    - name: Setup Python
      if: matrix.build_type == 'Release'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build bridge .exe
      if: matrix.build_type == 'Release'
      run: |
        pip install pyzmq tornado pyinstaller
        pyinstaller --onefile --name bridge-zround --hidden-import=zmq --hidden-import=tornado integrations/bridge-zround.py
        pyinstaller --onefile --name bridge-rcgtiming --hidden-import=zmq --hidden-import=tornado integrations/bridge-rcgtiming.py

    - name: Package binaries
      shell: msys2 {0}
      run: |
        set -eu
        # The .exe files and their DLLs both come from `cmake --install`. The
        # DLL set is resolved by install(RUNTIME_DEPENDENCY_SET) in
        # src/CMakeLists.txt, which replaces the old
        # `ldd | grep mingw64 | awk | xargs cp || true` line -- that one
        # swallowed its own failures, so a missing DLL only showed up as a
        # user's .exe refusing to start.
        cmake --install build --prefix "$PWD/staging"
        mkdir openstint-windows-x64
        cp staging/bin/* openstint-windows-x64/

        # With the SDR and DSP libraries linked statically, what is left is the
        # toolchain runtime, ZeroMQ and libusb. Assert the two binaries and at
        # least one DLL made it, so an empty or partial install fails here
        # rather than in a download.
        test -f openstint-windows-x64/openstint_hackrf.exe
        test -f openstint-windows-x64/openstint_rtlsdr.exe
        ls openstint-windows-x64/*.dll >/dev/null

        # liquid and fec are on this list even though they are system libraries
        # on every other platform. Neither is packaged for MSYS2, so both are
        # installed above as plain static archives with no import library --
        # which means they are linked into the .exe here and no DLL of either
        # should ever appear beside it.
        for lib in librtlsdr libhackrf libliquid libfec; do
          if ls openstint-windows-x64/ | grep -qi "${lib}"; then
            echo "::error::${lib} was shipped as a DLL; it must be linked statically"
            exit 1
          fi
        done
        ls -l openstint-windows-x64/

        cp README.md openstint-windows-x64/
        cp LICENSE openstint-windows-x64/
        cp tools/start.bat openstint-windows-x64/
        cp -r integrations openstint-windows-x64/

    - name: Add bridge executables
      if: matrix.build_type == 'Release'
      shell: msys2 {0}
      run: |
        cp dist/bridge-zround.exe openstint-windows-x64/
        cp dist/bridge-rcgtiming.exe openstint-windows-x64/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: openstint-windows-x64-${{ matrix.build_type }}
        path: openstint-windows-x64/

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Compute release metadata
      id: meta
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        else
          BRANCH="${GITHUB_REF_NAME}"
          echo "tag=nightly-${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "name=Nightly Windows Build (${BRANCH})" >> "$GITHUB_OUTPUT"
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Download release ZIPs
      uses: actions/download-artifact@v8
      with:
        pattern: openstint-windows-x64-*
        merge-multiple: true
        path: release-zips
        skip-decompress: true

    - name: Create or update release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.meta.outputs.tag }}
        name: ${{ steps.meta.outputs.name }}
        body: |
          Automated build of OpenStint for Windows 64-bit

          Branch: ${{ github.ref_name }}
          Built from commit ${{ github.sha }}
        files: release-zips/*.zip
        prerelease: ${{ steps.meta.outputs.prerelease }}
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
