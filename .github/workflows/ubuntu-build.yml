name: Ubuntu Build

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - '.github/workflows/ubuntu-build.yml'
  # Allow manual deploys from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++

    name: Build with ${{ matrix.compiler.name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          pkg-config \
          libusb-1.0-0-dev \
          libzmq3-dev \
          cppzmq-dev \
          libliquid-dev \
          libfec-dev

    - name: Install Clang
      if: matrix.compiler.cc == 'clang'
      run: |
        sudo apt-get install -y clang

    - name: Build OpenStint
      env:
        CC: ${{ matrix.compiler.cc }}
        CXX: ${{ matrix.compiler.cxx }}
      run: |
        mkdir build
        cd build
        cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release ..
        ninja

    - name: Verify binaries
      run: |
        ./build/src/openstint_hackrf -h || true
        ldd ./build/src/openstint_hackrf
        ./build/src/openstint_rtlsdr -h || true
        ldd ./build/src/openstint_rtlsdr

    - name: Verify the SDR libraries are linked statically
      run: |
        set -eu
        # The whole point of vendoring: if either of these reappears as a
        # NEEDED entry, the binary is back to using whatever the distribution
        # ships and the pinned driver version stops meaning anything. This is
        # the only step that can catch that, and it must catch it here rather
        # than at a race meeting -- the soname has been librtlsdr.so.0 since
        # 0.5.3, so an old library loads silently and merely fails to see the
        # dongle. liquid and fec are deliberately absent from the list: they
        # are system libraries here and are expected to show up.
        #
        # readelf -d, not ldd: ldd prints the whole transitive closure, which
        # answers "what gets loaded" rather than "what was this linked
        # against", and pulls in whatever libliquid.so.1 happens to depend on.
        # Only DT_NEEDED describes this binary's own link line.
        for bin in openstint_hackrf openstint_rtlsdr; do
          needed="$(readelf -d "./build/src/${bin}" |
                    sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')"
          for lib in librtlsdr libhackrf; do
            if printf '%s\n' "$needed" | grep -q "^${lib}"; then
              echo "::error::${bin} dynamically links ${lib}; it must be vendored"
              printf '%s\n' "$needed"
              exit 1
            fi
          done
        done
        echo "ok: no system SDR library is linked dynamically"
